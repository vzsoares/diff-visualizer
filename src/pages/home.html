<section x-data="diffSharer()" class="mx-auto flex w-full max-w-5xl flex-1 flex-col gap-4 px-4 py-8 md:px-8">

    <!-- Editor mode -->
    <div x-show="mode === 'editor'" class="flex flex-1 flex-col gap-4">

        <h1 class="text-2xl font-bold">Paste your diff</h1>

        <!-- Mode tabs -->
        <div role="tablist" class="tabs tabs-bordered w-fit">
            <button type="button" role="tab" class="tab"
                :class="inputMode === 'raw' ? 'tab-active' : ''"
                @click="inputMode = 'raw'">
                Paste diff
            </button>
            <button type="button" role="tab" class="tab"
                :class="inputMode === 'compare' ? 'tab-active' : ''"
                @click="inputMode = 'compare'">
                Compare texts
            </button>
        </div>

        <!-- Raw diff input -->
        <div x-show="inputMode === 'raw'" class="flex flex-1 flex-col gap-4">
            <p class="text-sm opacity-60">Paste a unified diff — it gets compressed into the URL so you can share the link with anyone.</p>
            <textarea
                x-model="rawDiff"
                data-testid="diff-input"
                placeholder="--- a/file.txt&#10;+++ b/file.txt&#10;@@ -1,3 +1,3 @@&#10; context&#10;-old line&#10;+new line"
                class="textarea textarea-bordered min-h-[60vh] flex-1 font-mono text-sm leading-relaxed"
                spellcheck="false"
            ></textarea>
            <div class="flex justify-end">
                <button
                    type="button"
                    data-testid="share-btn"
                    @click="share()"
                    :disabled="!rawDiff.trim()"
                    class="btn btn-primary"
                >
                    Share diff
                </button>
            </div>
        </div>

        <!-- Compare texts input -->
        <div x-show="inputMode === 'compare'" x-cloak class="flex flex-1 flex-col gap-4">
            <p class="text-sm opacity-60">Paste the original and modified text — we'll generate and share the diff.</p>
            <div class="grid flex-1 grid-cols-1 gap-4 md:grid-cols-2">
                <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium opacity-70">Original</label>
                    <textarea
                        x-model="originalText"
                        data-testid="original-input"
                        placeholder="Original text…"
                        class="textarea textarea-bordered h-[50vh] flex-1 font-mono text-sm leading-relaxed"
                        spellcheck="false"
                    ></textarea>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium opacity-70">Modified</label>
                    <textarea
                        x-model="modifiedText"
                        data-testid="modified-input"
                        placeholder="Modified text…"
                        class="textarea textarea-bordered h-[50vh] flex-1 font-mono text-sm leading-relaxed"
                        spellcheck="false"
                    ></textarea>
                </div>
            </div>
            <div class="flex justify-end">
                <button
                    type="button"
                    data-testid="compare-btn"
                    @click="compare()"
                    :disabled="!originalText && !modifiedText"
                    class="btn btn-primary"
                >
                    Compare &amp; share
                </button>
            </div>
        </div>

    </div>

    <!-- Viewer mode -->
    <div x-show="mode === 'viewer'" x-cloak class="flex flex-1 flex-col gap-4">
        <div class="flex flex-wrap items-center gap-2 rounded-box border border-base-300 bg-base-200 px-3 py-2">
            <input
                :value="shareUrl"
                readonly
                data-testid="share-url"
                class="input input-bordered input-sm min-w-0 flex-1 font-mono text-xs"
            />
            <button
                type="button"
                data-testid="copy-btn"
                @click="copyLink()"
                class="btn btn-sm shrink-0"
                :class="copied ? 'btn-success' : 'btn-outline'"
            >
                <span x-text="copied ? 'Copied!' : 'Copy link'"></span>
            </button>
            <button
                type="button"
                data-testid="new-diff-btn"
                @click="newDiff()"
                class="btn btn-sm btn-ghost shrink-0"
            >
                New diff
            </button>
        </div>
        <div class="overflow-auto rounded-box border border-base-300 bg-base-100">
            <div
                data-testid="diff-output"
                x-html="renderedHtml"
                x-effect="if (renderedHtml) $nextTick(() => Array.from($el.querySelectorAll('a')).forEach(a => a.setAttribute('native', '')))"
            ></div>
        </div>
    </div>

</section>
